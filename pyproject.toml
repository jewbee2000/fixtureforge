[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fixtureforge"
version = "0.1.0"
description = "Explicit straight-path CAD access contracts on CadQuery"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["cadquery==2.8.0", "pydantic==2.13.5", "psutil==7.2.2", "trimesh==5.1.1"]

[project.scripts]
fixtureforge = "fixtureforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixtureforge = ["_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
files = ["src/fixtureforge"]
ignore_missing_imports = true
check_untyped_defs = true

